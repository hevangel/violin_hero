[project]
name = "violin-hero-backend"
version = "0.1.0"
description = "FastAPI OMR backend for Violin Hero"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
